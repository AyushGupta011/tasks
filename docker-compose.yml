services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instant_mechanic
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: instant_mechanic
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instant_mechanic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://instant_mechanic:dev_password@postgres:5432/instant_mechanic
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production

volumes:
  postgres_data:
